<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Circeco</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Find circular places and events near you." />
  <meta name="theme-color" content="#0c343d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Circeco" />

  <link rel="manifest" href="manifest.webmanifest" />

  <!-- Standard ICO -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">

  <!-- PNG fallbacks -->
  <link rel="icon" type="image/png" href="assets/icons/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="assets/icons/favicon-16x16.png" sizes="16x16">

  <!-- Apple iOS home screen (Add to Home Screen does not use the web manifest) -->
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

  <!-- Bootstrap & Font Awesome (CDN) -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <!-- Mapbox & Geocoder CSS (CDN) -->
  <link rel="stylesheet" href="https://api.tiles.mapbox.com/mapbox-gl-js/v1.7.0/mapbox-gl.css" />
  <link rel="stylesheet"
    href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.2.0/mapbox-gl-geocoder.css" />

  <!-- Mapbox & Geocoder JS (CDN) — load before Angular boots -->
  <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v1.7.0/mapbox-gl.js"></script>
  <script
    src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.2.0/mapbox-gl-geocoder.min.js"></script>

</head>

<body>
  <app-root></app-root>
</body>

</html>
