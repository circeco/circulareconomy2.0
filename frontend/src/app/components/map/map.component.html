<section class="section scroll" id="circular_atlas">
  <aside id="maplist" class="atlas-sidebar">
    <div class="filter-section">
      <div class="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input
          id="feature-filter"
          type="search"
          class="search-input"
          placeholder="Search places..."
          (input)="onFilter($event)"
          aria-label="Search places"
        />
      </div>
    </div>

    <div class="listings-section">
      <div id="listings" class="listings">
        <div
          *ngFor="let item of filteredList; let i = index"
          class="item"
          [id]="'listing-' + i"
          (click)="focusOn(item)"
        >
          <div class="listing-header">
            <div class="stockholmlist" [id]="'link-' + i">
              {{ propsOf(item).STORE_NAME || propsOf(item).NAME || 'Unknown place' }}
            </div>
            <button
              class="heart-btn"
              type="button"
              aria-pressed="false"
              #heartBtn
              (click)="onHeartClick(heartBtn, item); $event.stopPropagation()"
            >♡</button>
          </div>

          <p
            class="address"
            *ngIf="propsOf(item).ADDRESS_LINE1 || propsOf(item).ADDRESS"
          >
            {{ propsOf(item).ADDRESS_LINE1 || propsOf(item).ADDRESS }}
          </p>
          <p *ngIf="propsOf(item).DESCRIPTION">{{ propsOf(item).DESCRIPTION }}</p>
        </div>

        <p class="listings-empty" *ngIf="!placesReady">
          Loading places…
        </p>
        <p class="listings-empty" *ngIf="placesReady && filteredList.length === 0">
          No places match the current filters.
        </p>
      </div>
    </div>
  </aside>

  <div class="map-action-tags-row">
    <button
      *ngFor="let tag of actionTagIds"
      type="button"
      class="map-action-tag-toggle"
      [class.active]="isActionTagEnabled(tag)"
      [style.--tag-color]="actionTagColor(tag)"
      [style.--tag-text-color]="actionTagTextColor(tag)"
      (click)="onToggleActionTag($event, tag)"
    >
      {{ actionTagLabel(tag) }}
    </button>
  </div>

  <div class="category-filters">
    <button
      type="button"
      class="category-pill"
      [class.active]="favoritesVisible"
      [attr.aria-pressed]="favoritesVisible"
      [attr.aria-disabled]="favoritesDisabled ? 'true' : null"
      aria-label="Show favourite places only"
      (click)="onToggleFavorites($event)"
    >
      <span class="category-pill-label">♥</span>
    </button>
    <button
      *ngFor="let cat of categoryIds"
      type="button"
      class="category-pill"
      [class.active]="isCatEnabled(cat)"
      (click)="onToggleCategory($event, cat)"
    >
      <span class="category-pill-label">{{ categoryLabel(cat) }}</span>
      <span class="category-icon" aria-hidden="true">
        <ng-container *ngIf="categoryImageIcons(cat).length; else atlasEmojiIcon">
          <span
            *ngFor="let iconPath of categoryImageIcons(cat)"
            class="category-icon-mask"
            [style.--icon-url]="'url(' + iconPath + ')'"
          ></span>
        </ng-container>
        <ng-template #atlasEmojiIcon>
          <span class="category-icon-emoji">{{ categoryEmojiIcon(cat) }}</span>
        </ng-template>
      </span>
    </button>
  </div>

  <div id="map" #mapHost></div>
</section>
