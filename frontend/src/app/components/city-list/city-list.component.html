<section class="city-list" aria-label="Choose city">
  <header class="city-list-header">
    <button type="button" class="city-list-back" aria-label="Back" (click)="back()">‹</button>
    <h1 class="city-list-title">Choose city</h1>
  </header>

  <ul class="city-list-grid">
    <li *ngFor="let city of rows()">
      <button
        type="button"
        class="city-card"
        [class.selected]="city.id === cityContext.cityId()"
        [attr.data-city]="city.id"
        [attr.aria-pressed]="city.id === cityContext.cityId()"
        [attr.aria-label]="city.name"
        (click)="select(city.id, city.name)"
      >
        <img
          *ngIf="city.photo"
          class="city-card-photo"
          [src]="city.photo"
          alt=""
        />
        <span class="city-card-name">{{ city.name }}</span>
        <span
          *ngIf="city.id === cityContext.cityId()"
          class="city-card-check"
          aria-hidden="true"
        >✓</span>
      </button>
    </li>
  </ul>
</section>
