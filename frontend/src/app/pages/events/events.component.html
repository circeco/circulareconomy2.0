<section class="events-page">
  <div class="map-action-tags-row">
    <button
      *ngFor="let tag of actionTagIds"
      type="button"
      class="map-action-tag-toggle"
      [class.active]="isActionTagEnabled(tag)"
      [style.--tag-color]="actionTagColor(tag)"
      [style.--tag-text-color]="actionTagTextColor(tag)"
      (click)="toggleActionTag(tag)"
    >
      {{ actionTagLabel(tag) }}
    </button>
    <button
      type="button"
      class="events-favorites-toggle"
      [class.active]="favoritesFilterActive()"
      [attr.aria-pressed]="favoritesFilterActive()"
      aria-label="Show favourite events only"
      (click)="toggleFavoritesFilter()"
    >
      ♥
    </button>
  </div>

  <div class="events-layout">
    <aside class="events-sidebar">
      <div class="filter-section">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            type="search"
            class="search-input"
            placeholder="Search places and events..."
            [value]="searchService.query()"
            (input)="onSearchInput($event)"
            aria-label="Search places and events"
          />
        </div>
      </div>

      <app-calendar
        [eventDates]="eventDatesForCalendar"
        [favoriteEventDates]="favoriteEventDatesForCalendar()"
        [initialSelection]="initialCalendarSelection"
        [initialViewDate]="initialCalendarViewDate"
        (selectedDatesChange)="onDatesChange($event)"
      ></app-calendar>

      <div class="category-filters">
        <button
          *ngFor="let cat of categories"
          type="button"
          class="category-pill"
          [class.active]="selectedCategory() === cat.id"
          (click)="selectCategory(cat.id)"
        >
          <span class="category-pill-label">{{ cat.label }}</span>
          <span class="category-icon" aria-hidden="true">
            <ng-container *ngIf="cat.imageIcons.length; else emojiIcon">
              <span
                *ngFor="let iconPath of cat.imageIcons"
                class="category-icon-mask"
                [style.--icon-url]="'url(' + iconPath + ')'"
              ></span>
            </ng-container>
            <ng-template #emojiIcon>
              <span class="category-icon-emoji">{{ cat.emojiIcon }}</span>
            </ng-template>
          </span>
        </button>
      </div>
    </aside>

    <div class="events-content">
      <div class="events-grid">
        <article
          *ngFor="let event of filteredEvents()"
          class="event-card"
          [attr.data-event-id]="event.id"
          [class.selected-event]="selectedEventId() === event.id"
        >
          <div class="event-card-content">
            <div class="event-card-header">
              <div class="action-tag-pills">
                <span
                  *ngFor="let tag of event.actionTags"
                  class="action-tag-pill"
                  [style.--tag-color]="actionTagColor(tag)"
                  [style.--tag-text-color]="actionTagTextColor(tag)"
                >
                  {{ actionTagLabel(tag) }}
                </span>
              </div>
              <button
                type="button"
                class="fav-btn"
                [class.favorited]="eventFavorites.isFavorite(event.id)"
                [attr.aria-label]="eventFavorites.isFavorite(event.id) ? 'Remove from favorites' : 'Add to favorites'"
                (click)="toggleFavorite(event.id)"
              >
                {{ eventFavorites.isFavorite(event.id) ? '♥' : '♡' }}
              </button>
            </div>

            <h2 class="event-title">{{ event.title }}</h2>

            <div class="event-datetime">
              <span class="event-date">{{ event.dateStr }}</span>
              <span class="event-recurrence" *ngIf="event.recurrenceLabel">{{ event.recurrenceLabel }}</span>
            </div>

            <div class="event-address" *ngIf="event.location">{{ event.location }}</div>

            <div
              class="event-description-block"
              *ngIf="event.description"
              [class.expanded]="isDescriptionExpanded(event.id)"
            >
              <p class="event-description">{{ event.description }}</p>
              <button
                *ngIf="descriptionNeedsMore(event.id, event.description)"
                type="button"
                class="desc-more-btn"
                (click)="toggleDescription(event.id)"
              >
                {{ isDescriptionExpanded(event.id) ? 'less' : 'more' }}
              </button>
            </div>

            <a
              *ngIf="event.website"
              class="event-website"
              [href]="event.website"
              [attr.title]="event.website"
              target="_blank"
              rel="noopener noreferrer"
            >
              {{ websiteDisplayLabel(event.website) }}
            </a>

            <div class="sector-icons" *ngIf="sectorIconsFor(event.sectorCategories).length">
              <span
                *ngFor="let iconPath of sectorIconsFor(event.sectorCategories)"
                class="sector-icon-mask"
                [style.--icon-url]="'url(' + iconPath + ')'"
                [attr.title]="sectorLabelForIcon(iconPath)"
                aria-hidden="true"
              ></span>
            </div>
          </div>
        </article>

        <p class="events-empty" *ngIf="filteredEvents().length === 0">
          {{ favoritesFilterActive() ? 'No events saved as favourite' : 'No events match the current filters.' }}
        </p>
      </div>
    </div>
  </div>
</section>
