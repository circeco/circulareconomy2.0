name: Schedule Keepalive

# Public repos auto-disable scheduled workflows after 60 days without repository
# activity. An empty mid-month commit counts as activity so monthly/weekly
# discovery crons keep firing.

on:
  schedule:
    # 04:00 UTC on day 15 of every month.
    - cron: '0 4 15 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: schedule-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Empty keepalive commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive scheduled discovery workflows"
          git push origin HEAD:main
