name: Queued Admin Discovery

# Starts only when you push it: GitHub → Actions → Queued Admin Discovery → Run workflow.
# Admin → Run discovery writes discoveryJobs; this job processes those docs.
# Local: npm run discover:jobs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queued-admin-discovery
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: circeco-bf511
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Write service account credentials
        shell: bash
        run: |
          set -euo pipefail
          CRED_PATH="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_CIRCECO_BF511 }}' > "$CRED_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_PATH" >> "$GITHUB_ENV"

      - name: Process queued discovery jobs
        run: npm run discover:jobs
